name: monthly-crime-refresh

# Runs on the 5th of each month (police data lags a month or two) and can be triggered by hand from the Actions tab.
on:
  schedule:
    - cron: "0 6 5 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    # Ephemeral PostgreSQL for the run. For a *persistent* warehouse, point the env vars below at a managed Postgres via repository secrets instead.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gm_crime
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: gm_crime
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run pipeline (latest month)
        run: python -m src.pipeline

      - name: Commit refreshed Tableau extracts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/*.csv
          git commit -m "Automated monthly data refresh" || echo "No changes to commit"
          git push
